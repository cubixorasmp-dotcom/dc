services:
  - type: worker
    name: cubixora-discord-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DISCORD_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: MC_WEBHOOK_SECRET
        sync: false
      - key: MC_HOST
        value: cubixorasmp.play.hosting
      - key: MC_JAVA_PORT
        value: "25565"
      - key: SITE_URL
        value: https://cubixoraweb.onrender.com
